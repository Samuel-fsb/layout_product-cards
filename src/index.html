<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
      initial-scale=1.0"
     />
    <title>Product cards</title>
    <link rel="preconnect"
          href="https://fonts.googleapis.com"
    >
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin="anonymous"
    >
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
          rel="stylesheet"
    >
    <link rel="stylesheet"
          href="./styles/main.scss"
    >
  </head>
  <body>
    <h1>Product cards</h1>

    <div class="card"
         data-qa="card">
      <img src="images/imac.jpeg"
           alt="APPLE A1419 iMac 27 Retina 5K Monoblock">
      <span class="card__title">APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</span>
      <p class="card__description">Product code: 195434</p>
      <div class="reviews">
        <div class="stars stars--4">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <p>Reviews: 5</p>
        </div>
      </div>
      <div class="card__price">
        <p>Price:</p>
        <p>$2,199</p>
      </div>
      <a href="#"
         data-qa="hover"
         class="card__buy-link">BUY
      </a>
    </div>

  </body>
</html>
